openapi: 3.0.3
info:
    title: Goveto Edge Control API
    version: 0.1.0
    description: Control-plane API for managing edge clusters, nodes, sites, certificates, publish, purge and analytics.
servers:
    - url: /
tags:
    - name: .well-known-acme-challenge
    - name: analytics
    - name: auth
    - name: auth-password
    - name: auth-password-reset
    - name: auth-security-policy
    - name: auth-sessions
    - name: auth-totp
    - name: certificates
    - name: clusters
    - name: clusters-analytics
    - name: clusters-certificates
    - name: clusters-jobs
    - name: clusters-nodes
    - name: clusters-site-templates
    - name: clusters-sites
    - name: clusters-ssh-credentials
    - name: dns
    - name: health
    - name: initialization
    - name: nodes
    - name: publish
    - name: purge
    - name: session
    - name: sites
paths:
    /.well-known/acme-challenge/{token}:
        get:
            operationId: serveChallenge
            summary: get /.well-known/acme-challenge/{token}
            tags:
                - .well-known-acme-challenge
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
            parameters:
                - name: token
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
    /api/v1/auth/login:
        post:
            operationId: login
            summary: Login
            description: Authenticate with email, password and optional TOTP code; sets session cookie.
            tags:
                - auth
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - Limit
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: string
                                email:
                                    type: string
                                password:
                                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            email:
                                                type: string
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            role:
                                                $ref: '#/components/schemas/model_UserRole'
                                            status:
                                                $ref: '#/components/schemas/model_UserStatus'
                                            totp_enabled:
                                                type: boolean
    /api/v1/auth/logout:
        post:
            operationId: logout
            summary: post /api/v1/auth/logout
            tags:
                - auth
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
    /api/v1/auth/me:
        get:
            operationId: me
            summary: Current user
            description: Return the authenticated user's profile.
            tags:
                - auth
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            email:
                                                type: string
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            role:
                                                $ref: '#/components/schemas/model_UserRole'
                                            status:
                                                $ref: '#/components/schemas/model_UserStatus'
                                            totp_enabled:
                                                type: boolean
    /api/v1/auth/password:
        put:
            operationId: changePassword
            summary: put /api/v1/auth/password
            tags:
                - auth-password
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
                - sensitive
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                current_password:
                                    type: string
                                new_password:
                                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
    /api/v1/auth/password-reset:
        post:
            operationId: completePasswordReset
            summary: post /api/v1/auth/password-reset
            tags:
                - auth-password-reset
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - Limit
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                new_password:
                                    type: string
                                token:
                                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
    /api/v1/auth/password-reset/admin-token:
        post:
            operationId: issuePasswordReset
            summary: post /api/v1/auth/password-reset/admin-token
            tags:
                - auth-password-reset
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
            responses:
                "201":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            expires_at:
                                                type: string
                                                format: date-time
                                                example: "2026-01-02T15:04:05Z"
                                            token:
                                                type: string
    /api/v1/auth/register:
        post:
            operationId: register
            summary: Register
            description: Create a new user account when registration is enabled; requires captcha.
            tags:
                - auth
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - Limit
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                captcha_token:
                                    type: string
                                email:
                                    type: string
                                name:
                                    type: string
                                password:
                                    type: string
            responses:
                "201":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            email:
                                                type: string
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            role:
                                                $ref: '#/components/schemas/model_UserRole'
                                            status:
                                                $ref: '#/components/schemas/model_UserStatus'
                                            totp_enabled:
                                                type: boolean
    /api/v1/auth/registration-config:
        get:
            operationId: registrationConfig
            summary: Registration config
            description: Return whether registration is enabled and public captcha settings.
            tags:
                - auth
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - Limit
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            enabled:
                                                type: boolean
    /api/v1/auth/security-policy:
        get:
            operationId: getSecurityPolicy
            summary: get /api/v1/auth/security-policy
            tags:
                - auth-security-policy
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            require_totp:
                                                type: boolean
        put:
            operationId: updateSecurityPolicy
            summary: put /api/v1/auth/security-policy
            tags:
                - auth-security-policy
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                require_totp:
                                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        $ref: '#/components/schemas/auth_securityPolicyResponse'
    /api/v1/auth/sessions:
        get:
            operationId: listSessions
            summary: get /api/v1/auth/sessions
            tags:
                - auth-sessions
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
    /api/v1/auth/sessions/{session_id}:
        delete:
            operationId: revokeSession
            summary: delete /api/v1/auth/sessions/{session_id}
            tags:
                - auth-sessions
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            parameters:
                - name: session_id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
    /api/v1/auth/sessions/revoke-others:
        post:
            operationId: revokeOtherSessions
            summary: post /api/v1/auth/sessions/revoke-others
            tags:
                - auth-sessions
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
    /api/v1/auth/totp:
        delete:
            operationId: disableTOTP
            summary: delete /api/v1/auth/totp
            tags:
                - auth-totp
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
                - sensitive
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: string
                                password:
                                    type: string
                                secret:
                                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
    /api/v1/auth/totp/enable:
        post:
            operationId: enableTOTP
            summary: post /api/v1/auth/totp/enable
            tags:
                - auth-totp
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
                - sensitive
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: string
                                password:
                                    type: string
                                secret:
                                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            recovery_codes:
                                                type: array
                                                items:
                                                    type: string
    /api/v1/auth/totp/recovery-codes:
        post:
            operationId: regenerateRecoveryCodes
            summary: post /api/v1/auth/totp/recovery-codes
            tags:
                - auth-totp
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
                - sensitive
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: string
                                password:
                                    type: string
                                secret:
                                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            recovery_codes:
                                                type: array
                                                items:
                                                    type: string
    /api/v1/auth/totp/reset:
        post:
            operationId: resetTOTP
            summary: post /api/v1/auth/totp/reset
            tags:
                - auth-totp
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
                - sensitive
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: string
                                password:
                                    type: string
                                secret:
                                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            secret:
                                                type: string
                                            uri:
                                                type: string
    /api/v1/auth/totp/setup:
        post:
            operationId: setupTOTP
            summary: post /api/v1/auth/totp/setup
            tags:
                - auth-totp
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            secret:
                                                type: string
                                            uri:
                                                type: string
    /api/v1/clusters:
        get:
            operationId: listAvailable
            summary: List clusters
            description: List clusters the current user can access and the selected cluster id.
            tags:
                - clusters
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            clusters:
                                                type: array
                                                items:
                                                    $ref: '#/components/schemas/clusters_clusterChoice'
                                            requires_cluster:
                                                type: boolean
                                            selected_cluster_id:
                                                type: string
        post:
            operationId: create
            summary: Create cluster
            description: Create a new cluster owned by the current user and select it in session.
            tags:
                - clusters
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - RequireAuth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
            responses:
                "201":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            cluster:
                                                type: object
                                                properties:
                                                    created_at:
                                                        type: string
                                                        format: date-time
                                                        example: "2026-01-02T15:04:05Z"
                                                    id:
                                                        type: string
                                                    name:
                                                        type: string
                                                    role:
                                                        type: string
                                                        enum:
                                                            - OWNER
                                            selected_cluster_id:
                                                type: string
    /api/v1/clusters/{cluster_id}/analytics/distributions/{dimension}:
        get:
            operationId: ranking
            summary: Ranking / distribution
            description: Rank or distribute traffic by dimension (period, sort, limit query params; node_id filter supported for 24h).
            tags:
                - analytics
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - require
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: dimension
                  in: path
                  required: true
                  schema:
                    type: string
                - name: limit
                  in: query
                  schema:
                    type: number
                - name: node_id
                  in: query
                  schema:
                    type: string
                - name: period
                  in: query
                  schema:
                    type: string
                - name: site_id
                  in: query
                  schema:
                    type: string
                - name: sort
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/analytics_DistributionItem'
    /api/v1/clusters/{cluster_id}/analytics/logs/stream:
        get:
            operationId: liveLogs
            summary: get /api/v1/clusters/{cluster_id}/analytics/logs/stream
            tags:
                - clusters-analytics
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - require
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: node_id
                  in: query
                  schema:
                    type: string
                - name: site_id
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        text/event-stream:
                            schema:
                                type: object
    /api/v1/clusters/{cluster_id}/analytics/nodes/logs:
        get:
            operationId: nodeLogs
            summary: get /api/v1/clusters/{cluster_id}/analytics/nodes/logs
            tags:
                - clusters-analytics
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - require
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: limit
                  in: query
                  schema:
                    type: number
                - name: node_id
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/analytics_NodeRequestLog'
    /api/v1/clusters/{cluster_id}/analytics/nodes/runtime:
        get:
            operationId: nodeRuntime
            summary: Node runtime series
            description: Time-series node runtime metrics (optional node_id filter).
            tags:
                - analytics
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - require
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: node_id
                  in: query
                  schema:
                    type: string
                - name: period
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: object
                                        properties:
                                            period:
                                                type: string
                                            series:
                                                type: array
                                                items:
                                                    $ref: '#/components/schemas/analytics_NodeRuntimePoint'
    /api/v1/clusters/{cluster_id}/analytics/nodes/runtime/latest:
        get:
            operationId: latestNodeRuntime
            summary: Latest node runtime metrics
            description: Latest recorded runtime metric for each node.
            tags:
                - analytics
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - require
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: node_id
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/analytics_NodeSnapshot'
    /api/v1/clusters/{cluster_id}/analytics/overview:
        get:
            operationId: monitoringOverview
            summary: Monitoring traffic overview
            description: Today, yesterday and current-month traffic totals.
            tags:
                - analytics
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - require
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: site_id
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        enum:
                                            - ok
                                    data:
                                        $ref: '#/components/schemas/analytics_MonitoringOverview'
    /api/v1/clusters/{cluster_id}/analytics/rankings/{dimension}:
        get:
            operationId: ranking
            summary: Ranking / distribution
            description: Rank or distribute traffic by dimension (period, sort, limit query params; node_id filter supported for 24h).
            tags:
                - analytics
            security:
                - cookie_session: []
            x-middlewares:
                - Middleware
                - Session
                - RequireActiveUser
                - RequireTOTPEnrollment
                - require
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  schema:
