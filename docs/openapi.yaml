    /api/v1/audit/events:
        get:
            operationId: listAuditEvents
            summary: List audit events
            description: Paginated, filterable audit log query; requires the platform audit-read permission.
            tags:
                - audit
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
                - clusteraccess.RequirePlatform
            parameters:
                - name: page
                  in: query
                  schema:
                    type: integer
                    minimum: 1
                    default: 1
                - name: page_size
                  in: query
                  schema:
                    type: integer
                    minimum: 1
                    maximum: 500
                    default: 100
                - name: actor
                  in: query
                  schema:
                    type: string
                - name: action
                  in: query
                  schema:
                    type: string
                - name: resource_type
                  in: query
                  schema:
                    type: string
                - name: resource_id
                  in: query
                  schema:
                    type: string
                - name: request_id
                  in: query
                  schema:
                    type: string
                - name: result
                  in: query
                  schema:
                    type: string
                    enum:
                        - SUCCESS
                        - FAILURE
                - name: from
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: to
                  in: query
                  description: Exclusive upper bound; a date-only value means midnight after that date.
                  schema:
                    type: string
                    format: date-time
            responses:
                "200":
                    description: Paginated audit events.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/auditapi_auditListResponse'
                "403":
                    description: Caller lacks the platform audit-read permission.
