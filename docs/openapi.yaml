openapi: 3.0.3
info:
    title: Goveto Edge Control API
    version: 0.1.0
    description: Control-plane API for managing edge clusters, nodes, sites, certificates, publish, purge and analytics.
servers:
    - url: /
tags:
    - name: .well-known-acme-challenge
    - name: admin-settings
    - name: analytics
    - name: audit
    - name: auth
    - name: auth-methods
    - name: auth-password
    - name: auth-password-reset
    - name: auth-providers
    - name: auth-security-policy
    - name: auth-sessions
    - name: auth-totp
    - name: certificates
    - name: clusters
    - name: clusters-analytics
    - name: clusters-certificates
    - name: clusters-jobs
    - name: clusters-nodes
    - name: clusters-site-templates
    - name: clusters-sites
    - name: clusters-ssh-credentials
    - name: dns
    - name: health
    - name: initialization
    - name: nodes
    - name: publish
    - name: purge
    - name: session
    - name: sites
paths:
    /.well-known/acme-challenge/{token}:
        get:
            operationId: serveChallenge
            summary: Serve challenge
            tags:
                - .well-known-acme-challenge
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
            parameters:
                - name: token
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        text/plain:
                            schema:
                                type: string
                "404":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/admin/settings:
        get:
            operationId: get
            summary: Get instance settings
            description: Return system-level settings visible only to the instance owner.
            tags:
                - admin-settings
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
                - requireInstanceOwner
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            agent_gateway_public_address:
                                                type: string
                                            authentication:
                                                $ref: '#/components/schemas/adminsettings_authenticationResponse'
                                            http_proxy:
                                                $ref: '#/components/schemas/settings_HTTPProxyConfig'
                                            restart_required:
                                                type: boolean
                                            restarting:
                                                type: boolean
        put:
            operationId: update
            summary: Update instance settings
            description: Update system-level settings as the instance owner.
            tags:
                - admin-settings
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
                - requireInstanceOwner
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                agent_gateway_public_address:
                                    type: string
                                authentication:
                                    $ref: '#/components/schemas/adminsettings_authenticationRequest'
                                http_proxy:
                                    $ref: '#/components/schemas/settings_HTTPProxyConfig'
                                restart:
                                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            agent_gateway_public_address:
                                                type: string
                                            authentication:
                                                $ref: '#/components/schemas/adminsettings_authenticationResponse'
                                            http_proxy:
                                                $ref: '#/components/schemas/settings_HTTPProxyConfig'
                                            restart_required:
                                                type: boolean
                                            restarting:
                                                type: boolean
                "400":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/login:
        post:
            operationId: login
            summary: Login
            description: Authenticate with email, password and optional TOTP code; sets session cookie.
            tags:
                - auth
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - limiter.Limit
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: string
                                email:
                                    type: string
                                password:
                                    type: string
                            required:
                                - email
                                - password
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            email:
                                                type: string
                                            id:
                                                type: string
                                            is_instance_owner:
                                                type: boolean
                                            name:
                                                type: string
                                            role:
                                                $ref: '#/components/schemas/model_UserRole'
                                            status:
                                                $ref: '#/components/schemas/model_UserStatus'
                                            totp_enabled:
                                                type: boolean
                                            totp_required:
                                                type: boolean
                "400":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "401":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "403":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "503":
                    description: Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/logout:
        post:
            operationId: logout
            summary: Logout
            tags:
                - auth
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
            responses:
                "204":
                    description: OK
                "503":
                    description: Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/me:
        get:
            operationId: me
            summary: Current user
            description: Return the authenticated user's profile.
            tags:
                - auth
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            email:
                                                type: string
                                            id:
                                                type: string
                                            is_instance_owner:
                                                type: boolean
                                            name:
                                                type: string
                                            role:
                                                $ref: '#/components/schemas/model_UserRole'
                                            status:
                                                $ref: '#/components/schemas/model_UserStatus'
                                            totp_enabled:
                                                type: boolean
                                            totp_required:
                                                type: boolean
                "401":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/methods:
        get:
            operationId: authMethods
            summary: Auth methods
            tags:
                - auth-methods
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - limiter.Limit
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            local_login_enabled:
                                                type: boolean
                                            providers:
                                                type: array
                                                items:
                                                    $ref: '#/components/schemas/auth_authProviderPublicResponse'
    /api/v1/auth/password:
        put:
            operationId: changePassword
            summary: Change password
            tags:
                - auth-password
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
                - sensitive
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                current_password:
                                    type: string
                                new_password:
                                    type: string
            responses:
                "204":
                    description: OK
                "400":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/password-reset:
        post:
            operationId: completePasswordReset
            summary: Complete password reset
            tags:
                - auth-password-reset
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - limiter.Limit
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                new_password:
                                    type: string
                                token:
                                    type: string
            responses:
                "204":
                    description: OK
                "400":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/password-reset/admin-token:
        post:
            operationId: issuePasswordReset
            summary: Issue password reset
            tags:
                - auth-password-reset
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
            responses:
                "201":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            expires_at:
                                                type: string
                                                format: date-time
                                                example: "2026-01-02T15:04:05Z"
                                            token:
                                                type: string
                "400":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "403":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "404":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/providers/{provider_id}/start:
        get:
            operationId: externalAuthStart
            summary: External auth start
            tags:
                - auth-providers
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - limiter.Limit
            parameters:
                - name: provider_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: return_to
                  in: query
                  schema:
                    type: string
            responses:
                "302":
                    description: Response
                "503":
                    description: Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/providers/callback:
        get:
            operationId: externalAuthCallback
            summary: External auth callback
            tags:
                - auth-providers
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - limiter.Limit
            parameters:
                - name: code
                  in: query
                  schema:
                    type: string
                - name: error
                  in: query
                  schema:
                    type: string
                - name: state
                  in: query
                  schema:
                    type: string
            responses:
                "302":
                    description: Response
                "503":
                    description: Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/register:
        post:
            operationId: register
            summary: Register
            description: Create a new user account when registration is enabled; requires captcha.
            tags:
                - auth
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - limiter.Limit
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                captcha_token:
                                    type: string
                                email:
                                    type: string
                                name:
                                    type: string
                                password:
                                    type: string
                            required:
                                - email
                                - name
            responses:
                "201":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            email:
                                                type: string
                                            id:
                                                type: string
                                            is_instance_owner:
                                                type: boolean
                                            name:
                                                type: string
                                            role:
                                                $ref: '#/components/schemas/model_UserRole'
                                            status:
                                                $ref: '#/components/schemas/model_UserStatus'
                                            totp_enabled:
                                                type: boolean
                "400":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "403":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "409":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "502":
                    description: Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "503":
                    description: Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/registration-config:
        get:
            operationId: registrationConfig
            summary: Registration config
            description: Return whether registration is enabled and public captcha settings.
            tags:
                - auth
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - limiter.Limit
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            captcha:
                                                $ref: '#/components/schemas/auth_captchaPublicResponse'
                                            enabled:
                                                type: boolean
    /api/v1/auth/security-policy:
        get:
            operationId: getSecurityPolicy
            summary: Get security policy
            tags:
                - auth-security-policy
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            require_totp:
                                                type: boolean
        put:
            operationId: updateSecurityPolicy
            summary: Update security policy
            tags:
                - auth-security-policy
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                require_totp:
                                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        $ref: '#/components/schemas/auth_securityPolicyResponse'
                "400":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "403":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/sessions:
        get:
            operationId: listSessions
            summary: List sessions
            tags:
                - auth-sessions
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/auth_sessionResponse'
    /api/v1/auth/sessions/{session_id}:
        delete:
            operationId: revokeSession
            summary: Revoke session
            tags:
                - auth-sessions
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
            parameters:
                - name: session_id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: OK
                "404":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/sessions/revoke-others:
        post:
            operationId: revokeOtherSessions
            summary: Revoke other sessions
            tags:
                - auth-sessions
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
            responses:
                "204":
                    description: OK
    /api/v1/auth/totp:
        delete:
            operationId: disableTOTP
            summary: Disable TOTP
            tags:
                - auth-totp
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
                - sensitive
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: string
                                password:
                                    type: string
                                secret:
                                    type: string
            responses:
                "204":
                    description: OK
                "400":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "401":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "409":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/totp/enable:
        post:
            operationId: enableTOTP
            summary: Enable TOTP
            tags:
                - auth-totp
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
                - sensitive
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: string
                                password:
                                    type: string
                                secret:
                                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    data:
                                        type: object
                                        properties:
                                            recovery_codes:
                                                type: array
                                                items:
                                                    type: string
                "400":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
                "409":
                    description: Client Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                    msg:
                                        type: string
    /api/v1/auth/totp/recovery-codes:
        post:
            operationId: regenerateRecoveryCodes
            summary: Regenerate recovery codes
            tags:
                - auth-totp
            security:
                - cookie_goveto_session: []
            x-middlewares:
                - httpsecurity.Middleware
                - sessions.Session
                - sessions.RequireActiveUser
                - authapi.RequireTOTPEnrollment
                - audit.Middleware
                - authn.RequireAuth
                - sensitive
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: string
                                password:
                                    type: string
