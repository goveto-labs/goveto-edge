<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Checking your browser</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f8fafc;
            --panel: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #475569;
            --faint: #64748b;
            --accent: #b91c1c;
            --hover: #f1f5f9;
            --info: #2563eb;
            --ok: #15803d;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0d10;
                --panel: #14181d;
                --border: #262d36;
                --text: #e8eaed;
                --muted: #9aa7b4;
                --faint: #7c8896;
                --accent: #f87171;
                --hover: #1c222a;
                --info: #60a5fa;
                --ok: #4ade80;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        main { width: 100%; max-width: 460px; text-align: center; }
        .mascot {
            width: min(56vw, 260px);
            aspect-ratio: 1 / 1;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
        }
        .mascot img { width: 100%; height: 100%; object-fit: contain; display: none; }
        body.state-checking #icon-checking,
        body.state-passed #icon-passed,
        body.state-failed #icon-failed { display: block; }
        .status {
            margin: 0 0 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            letter-spacing: .14em;
            text-transform: uppercase;
        }
        body.state-checking .status { color: var(--info); }
        body.state-passed .status { color: var(--ok); }
        body.state-failed .status { color: var(--accent); }
        body.state-passed .meter i { background: var(--ok); }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(26px, 5vw, 34px);
            line-height: 1.1;
            letter-spacing: -.02em;
            font-weight: 650;
        }
        .copy {
            margin: 0 0 28px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--muted);
        }
        .meter {
            height: 3px;
            margin: 14px 8px 12px;
            border-radius: 3px;
            background: var(--hover);
            overflow: hidden;
        }
        .meter i {
            display: block;
            height: 100%;
            width: 40%;
            border-radius: 3px;
            background: var(--info);
        }
        @media (prefers-reduced-motion: no-preference) {
            .meter i { animation: scan 1.4s ease-in-out infinite; }
            @keyframes scan {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(250%); }
            }
        }
        .status-detail { color: var(--muted); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        footer { position: fixed; bottom: 10px; width: 100%; text-align: center; color: var(--faint); font-size: 12.5px; }
        [hidden] { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>
