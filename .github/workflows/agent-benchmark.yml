name: Edge Agent benchmark calibration

on:
  pull_request:
    paths:
      - "caddy/**"
      - "cmd/agent-bench*/**"
      - "internal/agentbench/**"
      - "internal/edgeagent/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/agent-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microbench-calibration:
    name: microbench samples (trend only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test benchmark framework
        run: go test ./internal/agentbench
      - name: Collect ten microbenchmark samples
        run: |
          go test ./internal/edgeagent ./caddy/waf \
            -run '^$' \
            -bench 'Benchmark(RenderCaddyConfig|LogQueue|WAFRuleEvaluation|RateLimiter)$' \
            -benchmem -count 10 > agent-microbench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-microbench-${{ runner.arch }}
          path: agent-microbench.txt
          retention-days: 30

  command-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/edge-agent ./cmd/agent-bench ./cmd/agent-bench-origin ./cmd/agent-bench-gateway ./cmd/agent-bench-pki
