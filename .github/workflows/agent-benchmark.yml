name: Edge Agent benchmark calibration

on:
  pull_request:
    paths:
      - "caddy/**"
      - "cmd/agent-bench*/**"
      - "deploy/benchmark/**"
      - "cmd/edge-agent/**"
      - "internal/agentbench/**"
      - "internal/edgeagent/**"
      - "internal/edgeprotocol/**"
      - "internal/geoipdb/**"
      - "internal/policy/**"
      - "internal/securitystate/**"
      - "script/run_agent_benchmark.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/agent-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microbench-calibration:
    name: microbench samples (trend only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test benchmark framework
        run: go test ./internal/agentbench
      - name: Collect ten microbenchmark samples
        run: |
          go test ./internal/edgeagent ./caddy/waf ./caddy/cachematch \
            -run '^$' \
            -bench 'Benchmark(RenderCaddyConfig|LogQueue|WAFRuleEvaluation|RateLimiter|CacheRuleEvaluation)$' \
            -benchmem -count 10 > agent-microbench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-microbench-${{ runner.arch }}
          path: agent-microbench.txt
          if-no-files-found: warn
          retention-days: 30

  command-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/edge-agent ./cmd/agent-bench ./cmd/agent-bench-origin ./cmd/agent-bench-gateway ./cmd/agent-bench-pki
      - name: Check standalone and full cache matrix expansion
        run: |
          script/run_agent_benchmark.sh cache --protocols h1 --cache-repeats 1 --dry-run
          script/run_agent_benchmark.sh full --protocols h1 --soak-protocols h1 \
            --cache-repeats 1 --dry-run > full-benchmark-dry-run.txt
          grep -q 'cache-rules-fallback-h1-c128' full-benchmark-dry-run.txt
