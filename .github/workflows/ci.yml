name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: GOVETO_VERSION=v0.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  go:
    name: go build / vet / test / race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goveto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goveto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build release control plane with embedded agents and console
        run: script/build_control.sh "$RUNNER_TEMP/control-api"
      - name: Verify embedded agent and console artifacts
        run: go test -tags agent_artifacts,console_artifacts ./static ./internal/node
      - name: Build all commands and packages
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Alerting PostgreSQL integration tests
        env:
          GOVETO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/goveto_test?sslmode=disable
        run: go test -race ./internal/alerting -run Integration
      - name: Publish, initialization, API Key and live log integration tests
        env:
          GOVETO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/goveto_test?sslmode=disable
          GOVETO_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test -race ./internal/publisher ./internal/httpapi/initialization ./internal/apikey ./internal/analytics -run Integration
      - name: OpenAPI consistency
        run: go test ./internal/httpapi/ -run TestOpenAPISpecMatchesRegisteredRoutes

  frontend:
    name: frontend typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:                                                                                                                                                  
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build

  schema:
    name: gcorm schema validation and generated code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gco
        run: go install github.com/arsfy/gcorm/cmd/gco@v0.1.13
      - name: Validate schema
        run: gco validate --schema schema/schema.gcorm
      - name: Check generated code is up to date
        run: |
          gco generate --schema schema/schema.gcorm
          git diff --exit-code -- internal/storage/gen/
